title: Logon com NewCredentials (tipo 9)
status: experimental
description: Logon tipo 9, raro em ambiente normal; classico Pass-the-Hash (T1550.002)
author: wacatac-detection-analysis
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 9
    filter_runas:
        ProcessName|endswith: '\runas.exe'
    condition: selection and not filter_runas
falsepositives:
    - Uso legítimo de runas /netonly por administradores
level: medium
tags:
    - attack.t1550.002
