title: Rundll32 com DLL em pasta de usuario
status: experimental
description: rundll32 executando DLL fora de System32/Program Files (doc 09, T1218.011)
author: wacatac-detection-analysis
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_path:
        CommandLine|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
    filter_system:
        CommandLine|contains:
            - 'C:\\Windows\\System32'
            - 'C:\\Windows\\SysWOW64'
    condition: selection_img and selection_path and not filter_system
falsepositives:
    - Instaladores legítimos em pastas temporárias
level: high
tags:
    - attack.t1218.011
