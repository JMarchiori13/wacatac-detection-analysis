title: Exportacao de hive de credencial com reg save
status: experimental
description: reg save em SAM, SECURITY ou SYSTEM (extracao offline de credenciais)
author: wacatac-detection-analysis
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains: ' save '
    selection_hive:
        CommandLine|contains:
            - 'HKLM\SAM'
            - 'HKLM\SECURITY'
            - 'HKLM\SYSTEM'
            - 'HKU\'
    condition: selection and selection_hive
falsepositives:
    - Backup legítimo de administradores
level: high
tags:
    - attack.t1003
